name: Deploy Fluxcord site

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * *

jobs:
  build-and-deploy:
    runs-on: rotfront-node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup pnpm
        uses: https://github.com/pnpm/action-setup@v3
        with:
          version: latest
          cache: true

      - name: Install dependencies
        run: pnpm install

      - name: Build Astro site
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Publish to Cloudflare Pages
        run: pnpm dlx --allow-build=esbuild --allow-build=workerd wrangler pages deploy dist --project-name=fluxcord --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}